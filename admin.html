
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>育陽舞蹈團｜管理者後台</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f3f0;
  margin: 0;
  padding: 16px;
  color: #333;
}
.container {
  max-width: 1100px;
  margin: 20px auto;
  background: white;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 3px 15px #0001;
}
h1 { text-align: center; }
input, button, select {
  box-sizing: border-box;
  padding: 11px;
  margin: 6px 0;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 15px;
}
input { width: 100%; }
button {
  background: #655344;
  color: white;
  border: none;
  cursor: pointer;
}
button:disabled { opacity: .5; }
#loginButton { width: 100%; }
#message { margin: 12px 0; }
.hidden { display: none; }

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin: 18px 0;
}
.stat {
  background: #f5f1ed;
  padding: 16px;
  border-radius: 8px;
  text-align: center;
}
.stat strong {
  display: block;
  font-size: 25px;
  margin-top: 8px;
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.toolbar input {
  flex: 1;
  min-width: 180px;
}
.toolbar button { padding: 12px 16px; }

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 900px;
}
th, td {
  padding: 12px;
  border-bottom: 1px solid #eee;
  text-align: left;
}
th { background: #f3eee9; }
td select { width: 120px; }
@media (min-width: 700px) {
  .stats { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>

<body>
<div class="container">

<h1>YU YANG DANCE 育陽舞蹈團</h1>
<h2>管理者後台</h2>

<section id="loginArea">
  <h3>管理者登入</h3>
  <input id="email" type="email" placeholder="管理者電子郵件">
  <input id="password" type="password" placeholder="登入密碼">
  <button id="loginButton">登入</button>
</section>

<div id="message"></div>

<section id="adminArea" class="hidden">

  <div class="top">
    <h3>學員報名管理</h3>
    <button id="logoutButton">登出</button>
  </div>

  <h3>報名統計</h3>

  <div class="stats">
    <div class="stat">
      待確認
      <strong id="pendingCount">0</strong>
    </div>
    <div class="stat">
      已確認
      <strong id="confirmedCount">0</strong>
    </div>
    <div class="stat">
      候補
      <strong id="waitlistCount">0</strong>
    </div>
    <div class="stat">
      已繳費
      <strong id="paidCount">0</strong>
    </div>
  </div>

  <p id="total"></p>

  <div class="toolbar">
    <input
      id="searchInput"
      type="text"
      placeholder="搜尋姓名、電話或 Email"
    >
    <button id="exportButton">匯出 Excel</button>
<button id="refreshButton">重新整理</button>
<button id="promoteButton">遞補下一位</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>姓名</th>
          <th>電話</th>
          <th>Email</th>
          <th>報名狀態</th>
          <th>繳費狀態</th>
          <th>報名時間</th>
        </tr>
      </thead>
      <tbody id="registrationList"></tbody>
    </table>
  </div>

</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
const SUPABASE_URL = "https://aubecuexezekhurqpgnh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ANt2-fgu_mihXGzKVle_1g_RGZZp9VG";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let allRegistrations = [];

const loginArea = document.getElementById("loginArea");
const adminArea = document.getElementById("adminArea");
const message = document.getElementById("message");

function showMessage(text, success = false) {
  message.style.color = success ? "#287a42" : "#b33";
  message.textContent = text;
}

async function checkAdmin() {
  const { data: { user }, error: userError } =
    await db.auth.getUser();

  if (userError || !user) {
    loginArea.classList.remove("hidden");
    adminArea.classList.add("hidden");
    return;
  }

  const { data: admin, error } = await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error || !admin) {
    await db.auth.signOut();
    showMessage("此帳號沒有管理者權限。");
    return;
  }

  loginArea.classList.add("hidden");
  adminArea.classList.remove("hidden");

  showMessage("登入成功！", true);
  await loadRegistrations();
}

async function loadRegistrations() {
  showMessage("正在讀取報名資料……", true);

  const { data, error } = await db
    .from("registrations")
    .select("id, name, phone, email, status, payment_status, created_at")
    .order("created_at", { ascending: false });

  if (error) {
    showMessage("讀取失敗：" + error.message);
    return;
  }

  allRegistrations = data || [];

  updateStatistics();
  renderRegistrations(allRegistrations);

  showMessage("資料更新完成！", true);
}

function updateStatistics() {
  document.getElementById("pendingCount").textContent =
    allRegistrations.filter(x => x.status === "pending").length;

  document.getElementById("confirmedCount").textContent =
    allRegistrations.filter(x => x.status === "confirmed").length;

  document.getElementById("waitlistCount").textContent =
    allRegistrations.filter(x => x.status === "waitlist").length;

  document.getElementById("paidCount").textContent =
    allRegistrations.filter(x => x.payment_status === "paid").length;

  document.getElementById("total").textContent =
    "目前共有 " + allRegistrations.length + " 筆報名資料";
}

function renderRegistrations(data) {
  const list = document.getElementById("registrationList");
  list.innerHTML = "";

  if (data.length === 0) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 6;
    td.textContent = "找不到符合條件的學員資料";
    tr.appendChild(td);
    list.appendChild(tr);
    return;
  }

  data.forEach(item => {
    const tr = document.createElement("tr");

    function addText(value) {
      const td = document.createElement("td");
      td.textContent = value || "未提供";
      tr.appendChild(td);
    }

    addText(item.name);
    addText(item.phone);
    addText(item.email);

    const statusCell = document.createElement("td");
    const statusSelect = document.createElement("select");

    [
      ["pending", "待確認"],
      ["confirmed", "已確認"],
      ["waitlist", "候補"],
      ["cancelled", "取消"]
    ].forEach(([value, label]) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      statusSelect.appendChild(option);
    });

    statusSelect.value = item.status || "pending";

    statusSelect.addEventListener("change", async () => {
      await updateField(item.id, "status", statusSelect.value, statusSelect);
    });

    statusCell.appendChild(statusSelect);
    tr.appendChild(statusCell);

    const paymentCell = document.createElement("td");
    const paymentSelect = document.createElement("select");

    [
      ["unpaid", "未繳費"],
      ["paid", "已繳費"]
    ].forEach(([value, label]) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      paymentSelect.appendChild(option);
    });

    paymentSelect.value = item.payment_status || "unpaid";

    paymentSelect.addEventListener("change", async () => {
      await updateField(
        item.id,
        "payment_status",
        paymentSelect.value,
        paymentSelect
      );
    });

    paymentCell.appendChild(paymentSelect);
    tr.appendChild(paymentCell);

    addText(
      item.created_at
        ? new Date(item.created_at).toLocaleString("zh-TW")
        : ""
    );

    list.appendChild(tr);
  });
}

async function updateField(id, field, value, select) {
  select.disabled = true;
  showMessage("正在儲存修改……", true);

  const { data, error } = await db
    .from("registrations")
    .update({ [field]: value })
    .eq("id", id)
    .select("id");

  select.disabled = false;

  if (error || !data || data.length === 0) {
    showMessage(
      "修改失敗：" + (error ? error.message : "沒有成功更新資料")
    );
    await loadRegistrations();
    return;
  }

  showMessage("修改成功！", true);
  await loadRegistrations();
}

function searchRegistrations() {
  const keyword = document
    .getElementById("searchInput")
    .value.trim()
    .toLowerCase();

  const filtered = allRegistrations.filter(item => {
    return (
      (item.name || "").toLowerCase().includes(keyword) ||
      (item.phone || "").toLowerCase().includes(keyword) ||
      (item.email || "").toLowerCase().includes(keyword)
    );
  });

  renderRegistrations(filtered);
}

function exportExcel() {
  if (!window.XLSX) {
    showMessage("Excel 匯出工具載入失敗，請重新整理頁面。");
    return;
  }

  if (allRegistrations.length === 0) {
    showMessage("目前沒有可以匯出的資料。");
    return;
  }

  const rows = allRegistrations.map(item => ({
    "姓名": item.name,
    "電話": item.phone,
    "電子郵件": item.email || "",
    "報名狀態": {
      pending: "待確認",
      confirmed: "已確認",
      waitlist: "候補",
      cancelled: "取消"
    }[item.status] || item.status,
    "繳費狀態": {
      unpaid: "未繳費",
      paid: "已繳費"
    }[item.payment_status] || item.payment_status,
    "報名時間": item.created_at
      ? new Date(item.created_at).toLocaleString("zh-TW")
      : ""
  }));

  const worksheet = XLSX.utils.json_to_sheet(rows);
  const workbook = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    workbook,
    worksheet,
    "學員報名名單"
  );

  XLSX.writeFile(
    workbook,
    "育陽舞蹈團_報名名單.xlsx"
  );

  showMessage("Excel 名單已匯出！", true);
}

document.getElementById("loginButton")
.addEventListener("click", async () => {
  const button = document.getElementById("loginButton");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("請輸入電子郵件及密碼。");
    return;
  }

  button.disabled = true;
  showMessage("登入中……", true);

  const { error } = await db.auth.signInWithPassword({
    email,
    password
  });

  button.disabled = false;

  if (error) {
    showMessage("登入失敗：" + error.message);
    return;
  }

  await checkAdmin();
});

document.getElementById("logoutButton")
.addEventListener("click", async () => {
  await db.auth.signOut();
  allRegistrations = [];
  adminArea.classList.add("hidden");
  loginArea.classList.remove("hidden");
  showMessage("已登出。", true);
});

document.getElementById("searchInput")
.addEventListener("input", searchRegistrations);

document.getElementById("exportButton")
.addEventListener("click", exportExcel);

document.getElementById("refreshButton")
.addEventListener("click", loadRegistrations);

// 遞補下一位候補學員
document.getElementById("promoteButton")
.addEventListener("click", async () => {

  const confirmed = confirm(
    "確定要將最早報名的候補學員遞補為已確認嗎？"
  );

  if (!confirmed) return;

  const button = document.getElementById("promoteButton");

  button.disabled = true;
  showMessage("正在處理候補遞補……", true);

  const { data, error } = await db.rpc(
    "promote_next_waitlist"
  );

  button.disabled = false;

  if (error) {
    showMessage("遞補失敗：" + error.message);
    return;
  }

  if (!data.success) {
    showMessage(data.message);
    return;
  }

  showMessage(data.message, true);

  await loadRegistrations();
});

checkAdmin();
</script>

</body>
</html>
