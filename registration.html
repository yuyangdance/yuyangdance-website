
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>韓國舞蹈大師培訓｜育陽舞蹈團</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      background: #f7f4f0;
      color: #333;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px 24px;
      border-radius: 16px;
      box-shadow: 0 5px 25px #00000012;
    }

    h1 {
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #987b61;
      margin-bottom: 28px;
    }

    .info {
      background: #f7f2ec;
      padding: 18px;
      border-radius: 10px;
      line-height: 1.9;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 17px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      background: #8c7057;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      line-height: 1.8;
      white-space: pre-line;
    }

    .capacity {
  background: #f7f2ec;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 22px;
}

.capacity-title {
  font-weight: bold;
  margin-bottom: 12px;
}

.capacity-number {
  font-size: 30px;
  font-weight: bold;
  color: #655344;
}

.capacity-total {
  font-size: 16px;
  color: #888;
}

.progress {
  width: 100%;
  height: 10px;
  background: #e5ded6;
  border-radius: 20px;
  overflow: hidden;
  margin: 14px 0 10px;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: #8c7057;
  transition: width .3s;
}

.capacity-detail {
  font-size: 14px;
  color: #777;
}

.capacity-note {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid #e5ded6;
  color: #777;
  font-size: 13px;
  line-height: 1.8;
}

.note {
  color: #777;
  font-size: 13px;
  line-height: 1.8;
  margin-top: 20px;
}
  </style>
</head>

<body>
  <main class="container">

    <h1>韓國舞蹈大師培訓</h1>

    <div class="subtitle">
      YU YANG DANCE 育陽舞蹈團
    </div>

    <div class="capacity">
  <div class="capacity-title">目前招生狀況</div>

  <div class="capacity-number">
    <span id="registeredCount">讀取中</span>
    <span class="capacity-total">/ 30 人</span>
  </div>

  <div class="progress">
    <div id="progressBar"></div>
  </div>

  <div class="capacity-detail" id="capacityDetail">
    正在查詢剩餘名額……
  </div>
      <div class="capacity-note">
  <strong>報名名額提醒</strong><br>
  超額報名者將列入候補名單，若有名額釋出將依序通知。
      </div>
    </div>
    <div class="info">
      <strong>培訓課程資訊</strong><br>
      授課師資：韓國舞蹈大師<br>
      課程形式：完整培訓課程報名<br>
      招生名額：30 名<br>
      課程日期：尚未確定，另行公告<br>
      繳費方式：報名後由主辦單位通知繳費
    </div>

    <form id="registrationForm">

      <label for="name">姓名 *</label>
      <input
        id="name"
        name="name"
        required
        maxlength="80"
        autocomplete="name"
        placeholder="請輸入真實姓名"
      >

      <label for="phone">聯絡電話 *</label>
      <input
        id="phone"
        name="phone"
        required
        maxlength="30"
        autocomplete="tel"
        placeholder="請輸入聯絡電話"
      >

      <label for="email">電子郵件</label>
      <input
        id="email"
        name="email"
        type="email"
        maxlength="254"
        autocomplete="email"
        placeholder="請輸入電子郵件"
      >

      <button id="submitButton" type="submit">
        送出報名申請
      </button>

    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="note">
      ※ 本課程採整體培訓報名，不需分堂選擇。<br>
      ※ 報名後主辦單位將另行通知繳費方式。<br>
      ※ 報名資料僅供主辦單位處理課程報名使用。
    </div>

  </main>

  <!-- 載入 Supabase，只載入一次 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // 請保留你原本的 Supabase 網址及 Publishable Key
    const SUPABASE_URL = "https://aubecuexezekhurqpgnh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ANt2-fgu_mihXGzKVle_1g_RGZZp9VG";

    const form = document.getElementById("registrationForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    // 檢查 Supabase 套件是否成功載入
    if (!window.supabase) {
      message.textContent =
        "系統載入失敗，請重新整理頁面或聯絡主辦單位。";
      button.disabled = true;
      throw new Error("Supabase JavaScript 套件載入失敗");
    }

    // 建立 Supabase 連線
    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    // 讀取目前招生名額
async function loadCapacity() {
  const countElement = document.getElementById("registeredCount");
  const detailElement = document.getElementById("capacityDetail");
  const progressBar = document.getElementById("progressBar");
  const capacityTotal = 30;

  try {
    const { data, error } = await db.rpc(
      "get_registration_count"
    );

    if (error) {
      throw error;
    }

    const registered = Number(data);
    const remaining = Math.max(0, capacityTotal - registered);
    const percentage = Math.min(
      100,
      (registered / capacityTotal) * 100
    );

    countElement.textContent = registered;
    progressBar.style.width = percentage + "%";

    if (remaining > 0) {
      detailElement.textContent =
        "已占名額 " + registered +
        " 人，目前剩餘 " + remaining + " 名。";
    } else {
      detailElement.textContent =
        "目前招生名額已滿，歡迎填寫表單登記候補。";
    }

  } catch (error) {
    console.error("名額查詢失敗：", error);
    countElement.textContent = "--";
    detailElement.textContent =
      "目前無法取得名額資訊，請稍後重新整理。";
  }
}

// 網頁開啟時自動查詢
loadCapacity();
    // 處理報名送出
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (button.disabled) return;

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();

      if (!name || !phone) {
        message.textContent = "請填寫姓名及聯絡電話。";
        return;
      }

      button.disabled = true;
      button.textContent = "送出中...";
      message.textContent = "";

      try {
        const { data, error } = await db.rpc(
          "submit_registration",
          {
            p_name: name,
            p_phone: phone,
            p_email: email || null
          }
        );

        // 如果 Supabase 回傳錯誤
        if (error) {
          console.error("Supabase RPC 錯誤：", error);
          throw new Error(error.message || "資料庫連線失敗");
        }

        // 取得報名結果
        const result = Array.isArray(data) ? data[0] : data;

        if (!result) {
          throw new Error("沒有取得報名結果，請稍後再試。");
        }

        // 依照資料庫回傳狀態顯示訊息
        if (result.registration_status === "pending") {

          message.textContent =
            "報名申請已送出！\n" +
            "目前為待確認狀態，主辦單位將另行通知繳費。";

        } else if (result.registration_status === "waitlist") {

          message.textContent =
            "目前招生名額已滿，已為您登記候補。\n" +
            "如有名額釋出，主辦單位將另行聯絡。";

        } else {

          throw new Error("收到無法辨識的報名狀態。");

        }

        // 成功後才清空表單
        form.reset();
        
        // 更新目前招生名額
await loadCapacity();

      } catch (error) {

        console.error("報名失敗：", error);

        message.textContent =
          "報名失敗：" +
          (error.message || String(error)) +
          "\n請稍後再試，或聯絡主辦單位。";

      } finally {

        button.disabled = false;
        button.textContent = "送出報名申請";

      }
    });
  </script>

</body>
</html>
